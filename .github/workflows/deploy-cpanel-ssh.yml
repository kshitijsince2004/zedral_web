name: Deploy to cPanel (SSH)

# This is an alternative deployment method using SSH instead of FTP
# More secure but requires SSH access enabled in cPanel
# To use this instead of FTP:
# 1. Enable SSH in cPanel
# 2. Add SSH secrets to GitHub (see AUTO-DEPLOY-SETUP.md)
# 3. Delete or disable deploy-cpanel.yml
# 4. Rename this file to remove .example extension

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🔄 Checkout code
      uses: actions/checkout@v3
      
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 📥 Install dependencies
      run: npm ci
      
    - name: 🔨 Build project
      run: npm run build
      env:
        VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
        VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
      
    - name: 🚀 Deploy to cPanel via SSH
      uses: easingthemes/ssh-deploy@main
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        REMOTE_HOST: ${{ secrets.SSH_HOST }}
        REMOTE_USER: ${{ secrets.SSH_USERNAME }}
        REMOTE_PORT: ${{ secrets.SSH_PORT }}
        SOURCE: "dist/"
        TARGET: "/home/${{ secrets.SSH_USERNAME }}/public_html/"
        EXCLUDE: "/node_modules/, /.git/, /.github/"
        
    - name: ✅ Deployment complete
      run: echo "🎉 SSH Deployment successful!"
