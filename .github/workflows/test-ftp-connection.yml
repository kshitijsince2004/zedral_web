name: Test FTP Connection

# Run this manually to test your FTP credentials
# This will help diagnose connection issues

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🔍 Test FTP Connection
      run: |
        echo "Testing FTP connection..."
        echo "FTP Server: ${{ secrets.FTP_SERVER }}"
        echo "FTP Username: ${{ secrets.FTP_USERNAME }}"
        echo "Password length: ${#FTP_PASSWORD}"
        
        # Install lftp
        sudo apt-get update
        sudo apt-get install -y lftp
        
        # Test connection
        lftp -c "
        set ftp:ssl-allow yes;
        set ftp:ssl-force no;
        set ssl:verify-certificate no;
        set ftp:passive-mode on;
        set net:timeout 30;
        debug 5;
        open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }};
        pwd;
        ls;
        bye;
        "
      env:
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        
    - name: ✅ Connection test complete
      run: echo "If you see this, FTP connection works!"
