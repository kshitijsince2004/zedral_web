name: Deploy to cPanel (CURL)

# Most reliable method - uploads files individually
# Slower but handles connection issues better

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🔄 Checkout code
      uses: actions/checkout@v3
      
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 📥 Install dependencies
      run: npm ci
      
    - name: 🔨 Build project
      run: npm run build
      env:
        VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
        VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
      
    - name: 📂 List build output
      run: |
        echo "Build completed. Files to upload:"
        find dist -type f | wc -l
        echo "files found"
      
    - name: 🚀 Deploy via FTP (using CURL)
      run: |
        echo "Uploading files to cPanel..."
        
        # Upload files with better error handling
        cd dist
        
        # Upload index.html first
        echo "Uploading index.html..."
        curl -T "index.html" \
          ftp://${{ secrets.FTP_SERVER }}/public_html/index.html \
          --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
          --ftp-pasv \
          --connect-timeout 30 \
          --max-time 120 \
          --retry 3 \
          --retry-delay 2
        
        # Create assets directory
        echo "Creating assets directory..."
        curl --ftp-create-dirs \
          ftp://${{ secrets.FTP_SERVER }}/public_html/assets/ \
          --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
          || true
        
        # Upload all assets
        echo "Uploading assets..."
        for file in assets/*; do
          if [ -f "$file" ]; then
            filename=$(basename "$file")
            echo "Uploading: $filename"
            curl -T "$file" \
              ftp://${{ secrets.FTP_SERVER }}/public_html/assets/$filename \
              --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
              --ftp-pasv \
              --connect-timeout 30 \
              --max-time 120 \
              --retry 2 \
              --retry-delay 1 \
              --silent \
              --show-error || echo "Failed: $filename (continuing...)"
          fi
        done
        
        # Upload other root files
        echo "Uploading root files..."
        for file in *; do
          if [ -f "$file" ] && [ "$file" != "index.html" ]; then
            echo "Uploading: $file"
            curl -T "$file" \
              ftp://${{ secrets.FTP_SERVER }}/public_html/$file \
              --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
              --ftp-pasv \
              --connect-timeout 30 \
              --max-time 120 \
              --retry 2 \
              --silent \
              --show-error || echo "Failed: $file (continuing...)"
          fi
        done
        
        echo "Upload completed!"
        
    - name: ✅ Deployment complete
      run: echo "🎉 Deployment successful!"
