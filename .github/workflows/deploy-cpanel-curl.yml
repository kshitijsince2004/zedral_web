name: Deploy to cPanel (CURL)

# Most reliable method - uploads files individually
# Slower but handles connection issues better

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🔄 Checkout code
      uses: actions/checkout@v3
      
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 📥 Install dependencies
      run: npm ci
      
    - name: 🔨 Build project
      run: npm run build
      env:
        VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
        VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
      
    - name: 📂 List build output
      run: |
        echo "Build completed. Files to upload:"
        find dist -type f | wc -l
        echo "files found"
      
    - name: 🚀 Deploy via FTP (using CURL)
      run: |
        echo "Uploading files to cPanel..."
        
        # Function to upload a file
        upload_file() {
          local file="$1"
          local remote_path="${file#dist/}"
          local remote_dir=$(dirname "$remote_path")
          
          # Create directory if needed
          if [ "$remote_dir" != "." ]; then
            curl -s --ftp-create-dirs \
              ftp://${{ secrets.FTP_SERVER }}/public_html/$remote_dir/ \
              --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
              || true
          fi
          
          # Upload file with retry
          for i in {1..3}; do
            if curl -T "$file" \
              ftp://${{ secrets.FTP_SERVER }}/public_html/$remote_path \
              --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
              --ftp-pasv \
              --connect-timeout 30 \
              --max-time 300; then
              echo "✓ Uploaded: $remote_path"
              return 0
            else
              echo "⚠ Retry $i for: $remote_path"
              sleep 2
            fi
          done
          echo "✗ Failed: $remote_path"
          return 1
        }
        
        # Upload all files
        cd dist
        find . -type f | while read file; do
          upload_file "$file"
        done
        
    - name: ✅ Deployment complete
      run: echo "🎉 Deployment successful!"
