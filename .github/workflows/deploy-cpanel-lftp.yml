name: Deploy to cPanel (LFTP)

# Most reliable method for cPanel FTP deployment
# Uses LFTP with passive mode and SSL support

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🔄 Checkout code
      uses: actions/checkout@v3
      
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 📥 Install dependencies
      run: npm ci
      
    - name: 🔨 Build project
      run: npm run build
      env:
        VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
        VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
      
    - name: 📂 List build output
      run: ls -la dist/
      
    - name: 🚀 Deploy to cPanel via LFTP
      run: |
        sudo apt-get update
        sudo apt-get install -y lftp
        
        echo "Connecting to FTP server..."
        echo "Server: ftp.baghmaracampers.com"
        echo "Username: zedral_web@zedral.com"
        
        lftp -c "
        set ftp:ssl-allow no;
        set ftp:ssl-force no;
        set ssl:verify-certificate no;
        set ftp:passive-mode on;
        set net:timeout 30;
        set net:max-retries 10;
        set net:reconnect-interval-base 5;
        set ftp:list-options -a;
        open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }};
        cd /public_html || cd public_html;
        pwd;
        mirror -R --verbose --parallel=2 --exclude .git/ --exclude .github/ --exclude node_modules/ ./dist/ .;
        bye;
        "
        
    - name: ✅ Deployment complete
      run: echo "🎉 Deployment successful!"
