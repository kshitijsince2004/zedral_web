name: Deploy to cPanel (WinSCP Script)

# Uses WinSCP-style FTP commands
# Very reliable for cPanel

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🔄 Checkout code
      uses: actions/checkout@v3
      
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 📥 Install dependencies
      run: npm ci
      
    - name: 🔨 Build project
      run: npm run build
      env:
        VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
        VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
      
    - name: 🚀 Deploy via FTP (lftp with better settings)
      run: |
        sudo apt-get update
        sudo apt-get install -y lftp
        
        lftp -e "
        set ftp:ssl-allow yes;
        set ftp:ssl-protect-data true;
        set ftp:ssl-force false;
        set ssl:verify-certificate false;
        set ftp:passive-mode true;
        set net:timeout 60;
        set net:max-retries 10;
        set net:reconnect-interval-base 10;
        set net:reconnect-interval-multiplier 1;
        open ftp://${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}@${{ secrets.FTP_SERVER }};
        cd /public_html || mkdir -p /public_html;
        lcd dist;
        mirror --reverse --delete --verbose --parallel=2;
        quit;
        "
        
    - name: ✅ Deployment complete
      run: echo "🎉 Deployment successful!"
