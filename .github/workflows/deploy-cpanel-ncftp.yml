name: Deploy to cPanel (NCFTP)

# Alternative deployment using NCFTP
# More reliable for some cPanel configurations

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🔄 Checkout code
      uses: actions/checkout@v3
      
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 📥 Install dependencies
      run: npm ci
      
    - name: 🔨 Build project
      run: npm run build
      env:
        VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
        VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
      
    - name: 🚀 Deploy via NCFTP
      run: |
        sudo apt-get update
        sudo apt-get install -y ncftp
        
        # Create ncftp batch file
        cat > upload.ncftp << EOF
        open -u ${{ secrets.FTP_USERNAME }} -p ${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }}
        cd /public_html
        lcd dist
        put -R *
        quit
        EOF
        
        # Execute upload
        ncftpbatch -d upload.ncftp
        
    - name: ✅ Deployment complete
      run: echo "🎉 Deployment successful!"
