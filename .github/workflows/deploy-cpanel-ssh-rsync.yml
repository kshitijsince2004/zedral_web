name: Deploy to cPanel (SSH)

# Automated deployment using SSH and rsync
# Much more reliable than FTP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 🔄 Checkout code
      uses: actions/checkout@v3
      
    - name: 📦 Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 📥 Install dependencies
      run: npm ci
      
    - name: 🔨 Build project
      run: npm run build
      env:
        VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
        VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
      
    - name: 📂 List build output
      run: |
        echo "Build completed successfully!"
        echo "Files to deploy:"
        ls -lah dist/
        echo ""
        echo "Total size:"
        du -sh dist/
      
    - name: 🔐 Setup SSH
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
        
    - name: 🚀 Deploy via SSH + rsync
      run: |
        echo "Deploying to cPanel via SSH..."
        rsync -avz --delete \
          -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
          --exclude='.git' \
          --exclude='.github' \
          --exclude='node_modules' \
          --exclude='.env' \
          dist/ \
          ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/
        
    - name: 🧹 Cleanup
      if: always()
      run: rm -f ~/.ssh/deploy_key
        
    - name: ✅ Deployment complete
      run: |
        echo "🎉 Deployment successful!"
        echo "Your website has been updated at: ${{ secrets.VITE_SITE_URL }}"
