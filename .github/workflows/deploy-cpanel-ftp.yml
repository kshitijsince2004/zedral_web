name: Deploy to cPanel (SFTP)

# Automated deployment — push to main → build → SFTP upload to cPanel
# Uses lftp over sftp:// (port 22) — single SSH connection, no passive port issues.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 🔄 Checkout code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: 📥 Install dependencies
      run: npm ci
      env:
        PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

    - name: 🔨 Build project (+ pre-render all 13 routes)
      run: npm run build
      env:
        VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
        VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable

    - name: 📂 List build output
      run: |
        echo "✅ Build completed!"
        ls -lah dist/
        du -sh dist/

    - name: 📡 Install lftp
      run: sudo apt-get install -y lftp

    - name: 🚀 Deploy via SFTP (lftp) to cPanel
      env:
        SFTP_HOST: ${{ secrets.FTP_HOST }}
        SFTP_USER: ${{ secrets.SFTP_USERNAME }}
        SFTP_PASS: ${{ secrets.SFTP_PASSWORD }}
      run: |
        lftp -c "
          set sftp:auto-confirm yes;
          set net:timeout 60;
          set net:max-retries 3;
          set net:reconnect-interval-base 5;
          open sftp://$SFTP_HOST:22 -u \"$SFTP_USER\",\"$SFTP_PASS\";
          mirror --reverse --verbose --no-perms --parallel=4 ./dist/ /public_html/;
          quit
        "

    - name: ✅ Deployment complete
      run: echo "🎉 Deployed to ${{ secrets.VITE_SITE_URL }}"
