name: Deploy to cPanel (FTPS)

# Automated deployment — push to main → build → FTPS upload to cPanel
# Uses lftp over FTPS for secure file transfer.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 🔄 Checkout code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 📥 Install dependencies
      run: npm ci
      env:
        PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

    - name: 🔧 Free port 45678 for react-snap
      run: fuser -k 45678/tcp || true

    - name: 🔨 Build project (+ pre-render all 13 routes)
      run: npm run build
      env:
        VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
        VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable

    - name: 📂 List build output
      run: |
        echo "✅ Build completed!"
        ls -lah dist/
        du -sh dist/

    - name: 📡 Install lftp
      run: sudo apt-get install -y lftp

    - name: 🚀 Deploy to cPanel via FTPS
      env:
        FTP_HOST: ${{ secrets.FTP_HOST }}
        FTP_USER: ${{ secrets.FTP_USERNAME }}
        FTP_PASS: ${{ secrets.FTP_PASSWORD }}
      run: |
        lftp -c "
          set ssl:verify-certificate no;
          set ftp:ssl-force true;
          set ftp:ssl-protect-data true;
          set net:max-retries 3;

          open -u $FTP_USER,$FTP_PASS $FTP_HOST;

          mirror -R \
            --delete \
            --verbose \
            --no-perms \
            ./dist/ \
            public_html/;

          bye
        "

    - name: ✅ Deployment complete
      run: echo "🎉 Deployed to ${{ secrets.VITE_SITE_URL }}"
