name: Deploy to cPanel (FTP)

# Automated deployment — push to main → build → FTP upload to cPanel
# No SSH keys or server configuration needed, just FTP credentials.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 🔄 Checkout code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: 📥 Install dependencies
      run: npm ci
      env:
        # Skip bundled Chromium — use system Chrome on the runner instead
        PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

    - name: 🔨 Build project (+ pre-render all 13 routes)
      run: npm run build
      env:
        VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
        VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        # Point react-snap's puppeteer at the system Chrome already on the runner
        PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable

    - name: 📂 List build output
      run: |
        echo "✅ Build completed!"
        echo "Files to deploy:"
        ls -lah dist/
        echo ""
        echo "Total size:"
        du -sh dist/

    - name: 📡 Install lftp
      run: sudo apt-get install -y lftp

    - name: 🚀 Deploy via lftp to cPanel
      env:
        FTP_HOST: ${{ secrets.FTP_HOST }}
        FTP_USER: ${{ secrets.FTP_USERNAME }}
        FTP_PASS: ${{ secrets.FTP_PASSWORD }}
      run: |
        lftp -c "
          set ftp:ssl-allow true;
          set ftp:ssl-protect-data true;
          set ssl:verify-certificate false;
          set ftp:passive-mode true;
          set net:timeout 30;
          set net:max-retries 5;
          set net:reconnect-interval-base 5;
          open -u \"$FTP_USER\",\"$FTP_PASS\" ftps://$FTP_HOST;
          mirror --reverse --delete --verbose --no-perms --no-umask --parallel=4 ./dist/ /public_html/;
          quit
        "

    - name: ✅ Deployment complete
      run: |
        echo "🎉 Deployment successful!"
        echo "Live at: ${{ secrets.VITE_SITE_URL }}"
