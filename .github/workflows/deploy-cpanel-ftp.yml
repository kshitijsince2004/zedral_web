name: Deploy to cPanel (FTPS)

# Automated deployment — push to main → build → FTPS upload to cPanel
# Uses lftp over FTPS for secure file transfer.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 🔄 Checkout code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 📥 Install dependencies
      run: npm ci
      env:
        PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

    - name: 🔧 Free port 45678 for react-snap
      run: fuser -k 45678/tcp || true

    - name: 🔨 Build project (+ pre-render all 13 routes)
      run: npm run build
      env:
        VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
        VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable

    - name: 📂 List build output
      run: |
        echo "✅ Build completed!"
        ls -lah dist/
        du -sh dist/

    - name: 📦 Prepare Zip Payload
      run: |
        # Create a deployment folder
        mkdir deploy-payload
        
        # Zip the contents of the dist folder (so it extracts directly into the root, not into a 'dist' folder)
        cd dist
        zip -r ../deploy-payload/dist.zip .
        cd ..
        
        # Create a PHP script to extract the zip on the server
        cat << 'EOF' > deploy-payload/unzip.php
        <?php
        $zip = new ZipArchive;
        if ($zip->open('dist.zip') === TRUE) {
            $zip->extractTo('./');
            $zip->close();
            
            // Cleanup
            unlink('dist.zip');
            unlink('unzip.php');
            
            echo "Deployment successful!";
        } else {
            http_response_code(500);
            echo "Failed to extract dist.zip";
        }
        ?>
        EOF

    - name: 🚀 Upload Payload to cPanel via FTPS
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftps
        local-dir: ./deploy-payload/
        server-dir: ./public_html/
        dangerous-clean-slate: false

    - name: 💥 Trigger Extraction on Server
      run: |
        echo "Triggering unzip on the live server..."
        curl -f -sS "${{ secrets.VITE_SITE_URL }}/unzip.php"
        echo "🎉 Successfully deployed and extracted to ${{ secrets.VITE_SITE_URL }}"
