name: Deploy to cPanel (FTPS)

# Automated deployment — push to main → build → FTPS upload to cPanel
# Uses lftp over FTPS for secure file transfer.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 🔄 Checkout code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: 📥 Install dependencies
      run: npm ci
      env:
        PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

    - name: 🔧 Free port 45678 for react-snap
      run: fuser -k 45678/tcp || true

    - name: 🔨 Build project (+ pre-render all 13 routes)
      run: npm run build
      env:
        VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
        VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable

    - name: 📂 List build output
      run: |
        echo "✅ Build completed!"
        ls -lah dist/
        du -sh dist/

    - name: 🚀 Deploy to cPanel via FTPS
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        protocol: ftps
        local-dir: ./dist/
        server-dir: ./public_html/

    - name: ✅ Deployment complete
      run: echo "🎉 Deployed to ${{ secrets.VITE_SITE_URL }}"
