name: Deploy to cPanel (SFTP)

# Automated deployment — push to main → build → SFTP upload to cPanel
# Uses SSH/SFTP (port 22) — single encrypted connection, no passive port issues.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 🔄 Checkout code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: 📥 Install dependencies
      run: npm ci
      env:
        PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

    - name: 🔨 Build project (+ pre-render all 13 routes)
      run: npm run build
      env:
        VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
        VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}
        PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable

    - name: 📂 List build output
      run: |
        echo "✅ Build completed!"
        ls -lah dist/
        du -sh dist/

    - name: 🚀 Deploy via SFTP to cPanel
      uses: wlixcc/SFTP-Deploy-Action@v1.2.4
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.SFTP_USERNAME }}
        password: ${{ secrets.SFTP_PASSWORD }}
        port: 22
        local_path: './dist/*'
        remote_path: '/public_html/'
        sftp_only: true
        delete_remote_files: false

    - name: ✅ Deployment complete
      run: |
        echo "🎉 Deployed to ${{ secrets.VITE_SITE_URL }}"
